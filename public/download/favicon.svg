<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Squircle Base: Pure Matte Black -->
  <rect width="512" height="512" rx="138" fill="#0A0B0E"/>
  <rect x="6" y="6" width="500" height="500" rx="132" stroke="#1E2029" stroke-width="8"/>
  
  <!-- White 'F' Body: Spine and Top Arm -->
  <path 
    d="M 194.5 338 L 194.5 194.5 Q 194.5 158.7 235.5 158.7 L 327.7 158.7" 
    stroke="#FFFFFF" 
    stroke-width="61.4" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none" 
  />

  <!-- Green Middle Bar -->
  <path 
    d="M 194.5 248.3 L 286.7 248.3" 
    stroke="#00D084" 
    stroke-width="51.2" 
    stroke-linecap="round" 
    fill="none" 
  />

  <!-- Green Accent Spark Dot at Upper-Right Tip -->
  <circle cx="355.8" cy="128" r="19.5" fill="#00D084"/>
</svg>
